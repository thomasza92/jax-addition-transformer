[project]
name = "jax-frontier-llm"
version = "0.1.0"
description = "10m addition transformer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.14.0",
    "jax[cuda13]>=0.10.1",
    "tqdm>=4.67.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pyink]
line-length = 80
pyink-indentation = 2
pyink-use-majority-quotes = true

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]

[dependency-groups]
dev = [
    "pyink>=25.12.0",
    "ruff>=0.15.14",
]
